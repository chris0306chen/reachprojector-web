services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fulfillment_acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: isolated-test-only
    ports:
      - "127.0.0.1:55467:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d fulfillment_acceptance"]
      interval: 2s
      timeout: 2s
      retries: 30
  rest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://acceptance:isolated-test-only@db:5432/fulfillment_acceptance
      PGRST_DB_ANON_ROLE: acceptance
      PGRST_DB_SCHEMAS: public
    ports:
      - "127.0.0.1:55468:3000"
    depends_on:
      db:
        condition: service_healthy
